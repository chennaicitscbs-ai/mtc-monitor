name: MTC Portal Health Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Indian VPN
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn openvpn-systemd-resolved
          echo "${{ secrets.OVPN_CONFIG }}" > /tmp/client.ovpn
          printf "%s\n%s\n" "${{ secrets.VPN_USERNAME }}" "${{ secrets.VPN_PASSWORD }}" > /tmp/vpn_auth.txt
          chmod 600 /tmp/vpn_auth.txt /tmp/client.ovpn
          sudo openvpn --config /tmp/client.ovpn --auth-user-pass /tmp/vpn_auth.txt --data-ciphers "AES-128-CBC:AES-256-GCM:AES-128-GCM:BF-CBC" --data-ciphers-fallback AES-128-CBC --verb 4 --log /tmp/openvpn.log --daemon vpn-tunnel
          
          # Wait up to 25 seconds for VPN tunnel to initialize
          for i in {1..25}; do
            if ip a show tun0 > /dev/null 2>&1; then
              echo "✅ VPN tunnel tun0 is UP!"
              break
            fi
            sleep 1
          done
          
          echo "--- OpenVPN Log ---"
          sudo cat /tmp/openvpn.log || true
          
          echo "Outgoing Public IP:"
          curl -s --max-time 10 https://api.ipify.org || true
          echo ""

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run MTC Portal Monitor
        env:
          MTC_USERNAME: ${{ secrets.MTC_USERNAME }}
          MTC_PASSWORD: ${{ secrets.MTC_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug_failure.png
          if-no-files-found: ignore
